<!DOCTYPE html>
<html>
<head>
    <title>QR Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            background-color: #0078D4;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #005A9E;
        }
    </style>
</head>

<body>

    <h2>QR Registration Form</h2>

    <label>Deloitte Email</label>
    <input type="email"
           id="email"
           placeholder="Enter Deloitte Email">

    <label>Purpose of Visit</label>
    <textarea id="purpose"
              placeholder="Enter Purpose of Visit"></textarea>

    <label>Take Selfie</label>
    <input type="file"
           id="selfie"
           accept="image/*"
           capture="user">

    <button onclick="generateMail()">
        Generate Email
    </button>

<script>

function generateMail() {

    const email =
        document.getElementById("email").value;

    const purpose =
        document.getElementById("purpose").value;

    if (!email.endsWith("@deloitte.com")) {

        alert(
          "Please enter a valid Deloitte email address."
        );

        return;
    }

    const body =
`Hello,

QR Code Scanned Successfully.

User Email:
${email}

Purpose Of Visit:
${purpose}

Regards,
QR Registration System`;

    const mailto =
`mailto:aiswsj.ext@deloitte.com
?cc=${encodeURIComponent(email)}
&subject=${encodeURIComponent("QR Code Scan")}
&body=${encodeURIComponent(body)}`;

    window.location.href = mailto;
}

</script>

</body>
</html>
