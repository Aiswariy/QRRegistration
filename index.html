<!DOCTYPE html>
<html>
<head>
    <title>QR Registration Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        input, textarea, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        button {
            background-color: #0078D4;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #005A9E;
        }
    </style>
</head>

<body>

    <h2>QR Registration Form</h2>

    <label>Deloitte Email</label>
    <input type="email"
           id="email"
           placeholder="Enter Deloitte Email">

    <label>Purpose of Visit</label>
    <textarea id="purpose"
              placeholder="Enter Purpose of Visit"></textarea>

    <label>Take Selfie</label>
    <input type="file"
           id="selfie"
           accept="image/*"
           capture="user">

    <button onclick="generateMail()">
        Generate Email
    </button>

<script>

async function generateMail() {

    const email =
        document.getElementById("email").value;

    const purpose =
        document.getElementById("purpose").value;

    const selfie =
        document.getElementById("selfie").files[0];

    if (!email.endsWith("@deloitte.com")) {

        alert(
          "Please enter a valid Deloitte email address."
        );

        return;
    }

    const formData = new FormData();

    formData.append("email", email);
    formData.append("purpose", purpose);
    formData.append("selfie", selfie);

    const response = await fetch(
        "http://127.0.0.1:5000/upload",
        {
            method: "POST",
            body: formData
        }
    );

    const result = await response.json();

    alert("Upload Successful");

    console.log(result);
}

</script>

</body>
</html>
